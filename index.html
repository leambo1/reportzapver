<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ລາຍງານ - ZapVer Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Scrollable Tabs moved to the TOP -->
        <div class="tabs-wrapper">
            <div class="tabs-scrollable">
                <button class="tab-btn active" data-page="report_sales.html">
                    <i class="bi bi-receipt"></i> ລາຍງານການຂາຍ
                </button>
                <button class="tab-btn" data-page="report_products.html">
                    <i class="bi bi-box-seam"></i> ລາຍງານຂາຍຕາມສິນຄ້າ
                </button>
                <button class="tab-btn" data-page="report_revenue.html">
                    <i class="bi bi-wallet2"></i> ລາຍງານຍອດເງິນການຂາຍ
                </button>
                <button class="tab-btn" data-page="report_shift.html">
                    <i class="bi bi-clock-history"></i> ລາຍງານຕາມກະ
                </button>
            </div>
        </div>

        <!-- Content Area loaded via jQuery -->
        <div id="content-area">
            <div style="text-align:center; padding:50px; color:#888;">ກຳລັງໂຫຼດຂໍ້ມູນ...</div>
        </div>
    </div>
    
    <script>
        // Force reload of script.js by appending a timestamp
        var script = document.createElement('script');
        script.src = 'script.js?v=' + new Date().getTime();
        document.body.appendChild(script);
    </script>
</body>
</html>
